services:
  node:
    build:
      context: .
      dockerfile: Dockerfile
    volumes:
      - node_modules:/home/vscode/app/node_modules
      - ../:/home/vscode/app:cached
    tty: true
    stdin_open: true

  stripe-cli:
    image: stripe/stripe-cli:latest

  stripe-mock:
    image: stripe/stripe-mock:latest

volumes:
  node_modules:
